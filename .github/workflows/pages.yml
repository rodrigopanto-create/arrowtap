name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Test game logic
        run: cargo test --locked
      - name: Build WebAssembly release
        run: cargo build --locked --release --target wasm32-unknown-unknown
      - name: Prepare website
        run: |
          mkdir -p dist/target/wasm32-unknown-unknown/release
          cp index.html highscores.js pwa.js sw.js manifest.webmanifest dist/
          cp -R icons dist/
          curl --fail --location --retry 3 https://cdn.jsdelivr.net/gh/not-fl3/miniquad@4f13d4a70caf6a8cbf0187a95461658e7812b566/js/gl.js -o dist/gl.js
          cp target/wasm32-unknown-unknown/release/arrow.wasm dist/target/wasm32-unknown-unknown/release/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
